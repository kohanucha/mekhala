.lit_ln { animation: lit_ln 24.0s infinite; }
@keyframes card { 0% { opacity: 0; transform: translate(640px, 318px); } 2.500% { opacity: 1; transform: translate(640px, 318px); } 17.917% { opacity: 1; transform: translate(640px, 318px); } 20.833% { opacity: 1; transform: translate(640px, 470px); } 27.500% { opacity: 1; transform: translate(135px, 470px); } 30.000% { opacity: 1; transform: translate(135px, 318px); } 32.500% { opacity: 0; transform: translate(135px, 318px); } 100% { opacity: 0; transform: translate(135px, 318px); } }
.cardg { opacity: 0; animation: card 24.0s infinite; }
@keyframes tok0 { 0% { opacity: 0; transform: translate(825px, 138px); } 33.542% { opacity: 0; transform: translate(825px, 138px); } 34.583% { opacity: 1; transform: translate(825px, 138px); } 38.333% { opacity: 1; transform: translate(480px, 138px); } 39.375% { opacity: 0; transform: translate(480px, 138px); } 100% { opacity: 0; transform: translate(480px, 138px); } }
.tok0 { opacity: 0; animation: tok0 24.0s infinite; }
@keyframes tok1 { 0% { opacity: 0; transform: translate(825px, 138px); } 38.125% { opacity: 0; transform: translate(825px, 138px); } 39.167% { opacity: 1; transform: translate(825px, 138px); } 42.917% { opacity: 1; transform: translate(480px, 138px); } 43.958% { opacity: 0; transform: translate(480px, 138px); } 100% { opacity: 0; transform: translate(480px, 138px); } }
