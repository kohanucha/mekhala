@media (prefers-reduced-motion: reduce) { .tok, .cardg { animation: none; opacity: 0; } }</style>
<rect class="bg" x="0" y="0" width="960" height="520" rx="14"/>
<g class="cap0"><text x="40" y="70" class="num">STEP 1 / 6</text><text x="130" y="70" class="title">Create a connection in Alby Hub</text><text x="40" y="96" class="desc">The hub makes a new key for the app, sets its permissions and budget,</text><text x="40" y="116" class="desc">and gives you a nostr+walletconnect:// connection string.</text></g>
<rect x="40.0" y="26" width="140.0" height="5" rx="2.5" class="seg seg0"/>
<g class="cap1"><text x="40" y="70" class="num">STEP 2 / 6</text><text x="130" y="70" class="title">Link it to the app</text><text x="40" y="96" class="desc">Scan or paste it into Alby Go. The app now has its own key, the wallet's</text><text x="40" y="116" class="desc">public key and the relay URL. This step never touches the relay.</text></g>
<rect x="188.0" y="26" width="140.0" height="5" rx="2.5" class="seg seg1"/>
<g class="cap2"><text x="40" y="70" class="num">STEP 3 / 6</text><text x="130" y="70" class="title">Both sides connect to Mekhala</text><text x="40" y="96" class="desc">The wallet subscribes to requests for its key and publishes its info event</text><text x="40" y="116" class="desc">(kind 13194). The app reads it and subscribes to replies.</text></g>
<rect x="336.0" y="26" width="140.0" height="5" rx="2.5" class="seg seg2"/>
<g class="cap3"><text x="40" y="70" class="num">STEP 4 / 6</text><text x="130" y="70" class="title">The app sends pay_invoice</text><text x="40" y="96" class="desc">Encrypted with NIP-44 and signed. Mekhala checks the signature, answers OK,</text><text x="40" y="116" class="desc">and forwards it to the wallet without being able to read it.</text></g>
<rect x="484.0" y="26" width="140.0" height="5" rx="2.5" class="seg seg3"/>
<g class="cap4"><text x="40" y="70" class="num">STEP 5 / 6</text><text x="130" y="70" class="title">The wallet does the work</text><text x="40" y="96" class="desc">It decrypts the request, checks the app's permissions and budget,</text><text x="40" y="116" class="desc">and pays the invoice over Lightning.</text></g>
<rect x="632.0" y="26" width="140.0" height="5" rx="2.5" class="seg seg4"/>
<g class="cap5"><text x="40" y="70" class="num">STEP 6 / 6</text><text x="130" y="70" class="title">The result comes back</text><text x="40" y="96" class="desc">The wallet sends the result with the payment preimage, encrypted.</text><text x="40" y="116" class="desc">Mekhala forwards it to the app, and the payment is done.</text></g>
<rect x="780.0" y="26" width="140.0" height="5" rx="2.5" class="seg seg5"/>
<g class="wsline"><path d="M230 210 H385" class="ws"/><path d="M575 210 H730" class="ws"/><text x="307.5" y="232" text-anchor="middle" class="ws-t">WebSocket</text><text x="652.5" y="232" text-anchor="middle" class="ws-t">WebSocket</text></g>
<g class="offpath"><path d="M640 342 V470 H135 V342" class="offline"/><text x="388" y="492" text-anchor="middle" class="offline-t">QR code or copy-paste · does not go through the relay</text></g>
<rect x="40" y="160" width="190" height="100" rx="12" class="box lit_app"/><text x="135" y="202" text-anchor="middle" class="name">Alby Go</text><text x="135" y="226" text-anchor="middle" class="role">app</text><text x="135" y="278" text-anchor="middle" class="where">your phone</text>
<rect x="385" y="160" width="190" height="100" rx="12" class="box lit_relay"/><text x="480" y="202" text-anchor="middle" class="name">Mekhala</text><text x="480" y="226" text-anchor="middle" class="role">relay · wss://host/&lt;secret&gt;</text><text x="480" y="278" text-anchor="middle" class="where">Cloudflare Worker</text>
<rect x="730" y="160" width="190" height="100" rx="12" class="box lit_wallet"/><text x="825" y="202" text-anchor="middle" class="name">Alby Hub</text><text x="825" y="226" text-anchor="middle" class="role">wallet service</text><text x="825" y="278" text-anchor="middle" class="where">your node</text>
<rect x="730" y="379" width="190" height="52" rx="12" class="box lit_ln"/><text x="825" y="411" text-anchor="middle" class="name">Lightning network</text>
<g class="cardg"><rect x="-125" y="-24" width="250" height="48" rx="8" class="card"/><text x="0" y="-4" text-anchor="middle" class="card-t mono">nostr+walletconnect://&lt;wallet&gt;</text><text x="0" y="13" text-anchor="middle" class="card-t mono">?relay=wss://…&amp;secret=&lt;app key&gt;</text></g>
<g class="tok tok0"><rect x="-62.5" y="-13" width="125.0" height="26" rx="13" class="pill sub"/><text x="0" y="4.5" text-anchor="middle" class="pill-t sub">REQ  #p: wallet</text></g>
<g class="tok tok1"><rect x="-47.7" y="-13" width="95.4" height="26" rx="13" class="pill sub"/><text x="0" y="4.5" text-anchor="middle" class="pill-t sub">info  13194</text></g>
<g class="tok tok2"><rect x="-47.7" y="-13" width="95.4" height="26" rx="13" class="pill sub"/><text x="0" y="4.5" text-anchor="middle" class="pill-t sub">info  13194</text></g>
<g class="tok tok3"><rect x="-51.4" y="-13" width="102.8" height="26" rx="13" class="pill sub"/><text x="0" y="4.5" text-anchor="middle" class="pill-t sub">REQ  replies</text></g>
<g class="tok tok4"><rect x="-92.1" y="-13" width="184.2" height="26" rx="13" class="pill pay"/><text x="0" y="4.5" text-anchor="middle" class="pill-t pay">pay_invoice · encrypted</text></g>
<g class="tok tok5"><rect x="-14.4" y="-13" width="28.8" height="26" rx="13" class="pill ok"/><text x="0" y="4.5" text-anchor="middle" class="pill-t ok">OK</text></g>
<g class="tok tok6"><rect x="-92.1" y="-13" width="184.2" height="26" rx="13" class="pill pay"/><text x="0" y="4.5" text-anchor="middle" class="pill-t pay">pay_invoice · encrypted</text></g>
<g class="tok tok7"><rect x="-47.7" y="-13" width="95.4" height="26" rx="13" class="pill pay"/><text x="0" y="4.5" text-anchor="middle" class="pill-t pay">pay invoice</text></g>
<g class="tok tok8"><rect x="-36.6" y="-13" width="73.2" height="26" rx="13" class="pill ok"/><text x="0" y="4.5" text-anchor="middle" class="pill-t ok">preimage</text></g>
<g class="tok tok9"><rect x="-114.3" y="-13" width="228.6" height="26" rx="13" class="pill pay"/><text x="0" y="4.5" text-anchor="middle" class="pill-t pay">result + preimage · encrypted</text></g>
<g class="tok tok10"><rect x="-114.3" y="-13" width="228.6" height="26" rx="13" class="pill pay"/><text x="0" y="4.5" text-anchor="middle" class="pill-t pay">result + preimage · encrypted</text></g>
<g class="doneg"><text x="135" y="298" text-anchor="middle" class="done">✓ Paid</text></g>
</svg>
