.tok2 { opacity: 0; animation: tok2 24.0s infinite; }
@keyframes tok3 { 0% { opacity: 0; transform: translate(135px, 138px); } 45.625% { opacity: 0; transform: translate(135px, 138px); } 46.667% { opacity: 1; transform: translate(135px, 138px); } 49.583% { opacity: 1; transform: translate(480px, 138px); } 50.625% { opacity: 0; transform: translate(480px, 138px); } 100% { opacity: 0; transform: translate(480px, 138px); } }
.tok3 { opacity: 0; animation: tok3 24.0s infinite; }
