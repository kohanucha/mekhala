<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
<title id="t">How an NWC payment travels through Mekhala</title>
<desc id="d">Six steps: create a connection in Alby Hub, link it to Alby Go, both connect to the relay, the app sends an encrypted pay_invoice, the wallet pays over Lightning, and the encrypted result returns to the app.</desc>
<style>
