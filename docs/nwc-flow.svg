.tok4 { opacity: 0; animation: tok4 24.0s infinite; }
@keyframes tok5 { 0% { opacity: 0; transform: translate(480px, 138px); } 56.042% { opacity: 0; transform: translate(480px, 138px); } 57.083% { opacity: 1; transform: translate(480px, 138px); } 59.583% { opacity: 1; transform: translate(135px, 138px); } 60.625% { opacity: 0; transform: translate(135px, 138px); } 100% { opacity: 0; transform: translate(135px, 138px); } }
.tok5 { opacity: 0; animation: tok5 24.0s infinite; }
@keyframes tok6 { 0% { opacity: 0; transform: translate(480px, 138px); } 58.958% { opacity: 0; transform: translate(480px, 138px); } 60.000% { opacity: 1; transform: translate(480px, 138px); } 64.167% { opacity: 1; transform: translate(825px, 138px); } 65.208% { opacity: 0; transform: translate(825px, 138px); } 100% { opacity: 0; transform: translate(825px, 138px); } }
.tok6 { opacity: 0; animation: tok6 24.0s infinite; }
