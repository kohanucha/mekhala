name = "mekhala"
main = "build/worker/shim.mjs"
compatibility_date = "2026-04-30"

# Serve only on the custom domain bound to this Worker. `workers.dev` is a
# second public entrypoint nobody asks for, and version preview URLs would
# expose unreleased code on the same domain family. Set `workers_dev = true`
# only when a deployment has no custom domain attached yet.
workers_dev = false
preview_urls = false

[vars]
# Durable Object placement
DO_REGION = "apac"

# CONN: connections, admission and sweeps
CONN_MAX_TOTAL = "100"
CONN_MAX_PER_IP = "5"
CONN_MAX_PER_ASN = "20"
CONN_IDLE_TIMEOUT_SECONDS = "120"
CONN_SWEEP_SECONDS = "60"
CONN_EVICT_MIN_IDLE_SECONDS = "10"
CONN_ORPHAN_SWEEP_SECONDS = "3600"

# SUB: subscriptions and filters
SUB_MAX_PER_CONN = "100"
SUB_MAX_FILTER_VALUES = "10"
SUB_MAX_FILTERS = "10"
SUB_MAX_ROUTING_KEYS = "1000"

# EVENT: accepted event size
EVENT_MAX_CONTENT_BYTES = "98304"
EVENT_MAX_TAGS = "10"

# INFO: wallet info event cache
INFO_CACHE_MAX_EVENTS = "1000"
INFO_CACHE_TTL_SECONDS = "2592000"

[[durable_objects.bindings]]
name = "MEKHALA_NWC_DO"
class_name = "CloudflareTransport"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CloudflareTransport"]

[build]
command = "./scripts/build.sh"
watch_dir = "src"
