name = "mekhala"
main = "build/worker/shim.mjs"
compatibility_date = "2026-04-30"

# Serve only on the custom domain bound to this Worker. `workers.dev` is a
# second public entrypoint nobody asks for, and version preview URLs would
# expose unreleased code on the same domain family. Set `workers_dev = true`
# only when a deployment has no custom domain attached yet.
workers_dev = false
preview_urls = false

[vars]
WALLET_REGION = "apac"
MAX_CONNECTIONS = "100"
MAX_CONTENT_LENGTH = "98304"
MAX_SUBSCRIPTIONS_PER_CONNECTION = "100"
MAX_FILTER_ITEMS = "10"
MAX_EVENT_TAGS = "10"
MAX_ROUTING_KEYS_PER_CONNECTION = "1000"

[[durable_objects.bindings]]
name = "MEKHALA_NWC_DO"
class_name = "CloudflareTransport"

[[kv_namespaces]]
binding = "MEKHALA_NWC_KV"
id = "MEKHALA_NWC_KV_ID"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CloudflareTransport"]

[build]
command = "./scripts/build.sh"
watch_dir = "src"
