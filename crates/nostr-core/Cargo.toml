[package]
name = "nostr-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Nostr protocol types (NIP-01/04/44/47) shared by the mekhala relay and NWC clients"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
k256 = { version = "0.14", features = ["schnorr", "serde", "ecdh"] }
sha2 = "0.11"
hex = "0.4"
aes = "0.9"
cbc = "0.2"
block-padding = "0.4"
cipher = "0.5"
base64 = "0.22"
url = "2.5"
rand = "0.10"
hkdf = "0.13"
chacha20 = "0.10"
hmac = "0.13"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `rand` draws from `getrandom`, which needs the JavaScript backend in a Worker.
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"

[lints]
workspace = true
