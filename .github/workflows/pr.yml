name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-version` in Cargo.toml.
          toolchain: '1.91.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check against MSRV
        run: cargo check --all-targets --locked

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Rustdoc check
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Production code only: `cloudflare/` needs a live workerd (the integration
      # suite exercises it instead), and `*_test.rs` would otherwise count its
      # own ~99% coverage into the denominator and mask gaps in the source.
      - name: Coverage gate
        run: >-
          cargo llvm-cov --locked
          --ignore-filename-regex '(cloudflare/|_test\.rs$)'
          --fail-under-lines 95 --fail-under-regions 90 --fail-under-functions 80

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Deny check
        run: cargo deny check

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'test/package-lock.json'

      - name: Install Integration Test Dependencies
        working-directory: test
        run: npm ci

      - name: Cache worker-build
        id: cache-worker-build
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-worker-build

      - name: Run Full Test Suite
        run: |
          chmod +x scripts/*.sh
          ./scripts/test.sh
