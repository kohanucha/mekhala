name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'test/package.json'

      - name: Install Dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run Full Test Suite
        run: |
          chmod +x scripts/*.sh
          ./scripts/test.sh
