name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy check
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage gate
        run: cargo llvm-cov --ignore-filename-regex 'cloudflare/' --fail-under-lines 90

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Deny check
        run: cargo deny check

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'test/package.json'

      - name: Install Integration Test Dependencies
        working-directory: test
        run: npm install

      - name: Cache worker-build
        id: cache-worker-build
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-worker-build

      - name: Run Full Test Suite
        run: |
          chmod +x scripts/*.sh
          ./scripts/test.sh
