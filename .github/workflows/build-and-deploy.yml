name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install worker-build
        run: |
          if ! command -v worker-build &> /dev/null; then
            cargo install worker-build
          fi

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
          preCommands: |
            # 1. Find existing KV ID by name (Wrangler names it <PROJECT>-<BINDING>)
            KV_ID=$(npx wrangler kv namespace list | jq -r '.[] | select(.title == "mekhala-MEKHALA_NWC_KV") | .id')

            # 2. Create if not found
            if [ -z "$KV_ID" ] || [ "$KV_ID" == "null" ]; then
              echo "Creating new KV namespace..."
              KV_ID=$(npx wrangler kv namespace create MEKHALA_NWC_KV --json | jq -r '.id')
            fi

            if [ -z "$KV_ID" ] || [ "$KV_ID" == "null" ]; then
              echo "Error: Could not obtain KV ID"
              exit 1
            fi

            echo "Using KV_ID: $KV_ID"
            # 3. Inject into wrangler.toml for this CI run only
            sed -i "s/id = \"MEKHALA_NWC_KV_ID\"/id = \"$KV_ID\"/" wrangler.toml
