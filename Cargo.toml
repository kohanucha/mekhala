[package]
name = "mekhala"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
k256 = { version = "0.14", default-features = false, features = ["schnorr"] }
sha2 = "0.11"
hex = "0.4"
console_error_panic_hook = "0.1.7"
async-trait = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
futures = "0.3.32"
thiserror = "2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Curated lints promoted to errors by CI's `-D warnings`. Declared here so
# they apply to every target (lib, tests) locally and in CI instead of
# living only in the workflow command.
redundant_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
missing_errors_doc = "warn"
doc_markdown = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
uninlined_format_args = "warn"
use_self = "warn"
manual_string_new = "warn"

[profile.release]
opt-level = "s"
lto = true
# NOTE: `strip = true` must NOT be added back. wasm-bindgen >= 0.2.125
# hard-requires the externref table in the wasm binary, and stripping
# deletes it, which makes worker-build fail with "externref table required
# for catch wrappers" (cloudflare/workers-rs#1014, upstream wasm-bindgen
# fix pending). worker-build's wasm-opt pass keeps release size down.
panic = "abort"
codegen-units = 1
