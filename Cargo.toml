[package]
name = "mekhala"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.7"
worker-sys = "0.8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
k256 = { version = "0.14", features = ["schnorr", "serde", "ecdh"] }
sha2 = "0.11"
hex = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1.7"
async-trait = "0.1"
futures-util = "0.3"
aes = "0.9"
cbc = "0.2"
block-padding = "0.4"
cipher = "0.5"
base64 = "0.22"
url = "2.5"
rand = "0.10"
js-sys = "0.3"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
hkdf = "0.13"
chacha20 = "0.10"
hmac = "0.13"
futures = { version = "0.3.32", features = ["thread-pool"] }

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = "s"
lto = true
# NOTE: `strip = true` must NOT be added back. wasm-bindgen >= 0.2.125
# hard-requires the externref table in the wasm binary, and stripping
# deletes it, which makes worker-build fail with "externref table required
# for catch wrappers" (cloudflare/workers-rs#1014, upstream wasm-bindgen
# fix pending). worker-build's wasm-opt pass keeps release size down.
panic = "abort"
codegen-units = 1
