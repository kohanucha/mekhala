[package]
name = "nwc-relay"
version = "0.1.0"
edition = "2021"

[lib]
name = "nwc_relay"
path = "src/lib.rs"

[[bin]]
name = "nwc-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
sled = "0.34"
clap = { version = "4", features = ["derive", "env"] }
nostr = { version = "0.44", default-features = false, features = ["std"] }
hex = "0.4"
sha2 = "0.10"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1