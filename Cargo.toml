[package]
name = "mekhala"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.1"
worker-sys = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
k256 = { version = "0.13", features = ["schnorr", "serde", "ecdh"] }
sha2 = "0.10"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1.7"
async-trait = "0.1"
futures-util = "0.3"
aes = "0.8"
cbc = "0.1"
block-padding = "0.3"
cipher = "0.4"
base64 = "0.22"
url = "2.5"
rand = "0.8"
js-sys = "0.3"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
hkdf = "0.12"
chacha20 = "0.9"
hmac = "0.12"
futures = { version = "0.3.32", features = ["thread-pool"] }

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
