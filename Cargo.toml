[package]
name = "nwc-relay"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
sled = "0.34"
clap = { version = "4", features = ["derive", "env"] }
nostr = { version = "0.37", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
strip = true
lto = true
codegen-units = 1